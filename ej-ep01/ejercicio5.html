<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de registro</title>
  <link rel="stylesheet" href="estilo/ejercicio5.css">
</head>
<body>
  <main>
    <header>
      <h1>Registro</h1>
      <p>Introduce tus datos para acceder al laboratorio digital.</p>
    </header>

    <form action="#" method="post">
      <div>
        <label for="nombre">Nombre</label>
        <input id="nombre" name="nombre" type="text" autocomplete="name" required minlength="2" placeholder="Tu nombre">
      </div>
      <div>
        <label for="email">Correo electronico</label>
        <input id="email" name="email" type="email" autocomplete="email" required placeholder="nombre@ejemplo.com">
      </div>
      <div>
        <label for="contrasena">Contrasena</label>
        <input id="contrasena" name="contrasena" type="password" autocomplete="new-password" required minlength="8" placeholder="Minimo 8 caracteres">
      </div>
      <button type="submit">Crear cuenta</button>
    </form>
  </main>
</body>
</html>
