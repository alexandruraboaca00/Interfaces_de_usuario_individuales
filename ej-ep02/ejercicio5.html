<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de registro</title>
  <link rel="stylesheet" href="estilo/comun.css">
  <script src="script/ejercicio5.js" defer></script>
</head>
<body>
  <main>
    <h1>Registro</h1>
    <p>Introduce tus datos para acceder al laboratorio digital.</p>
    <form id="registro" novalidate>
      <label for="nombre">Nombre</label>
      <input id="nombre" name="nombre" autocomplete="name" required minlength="4">
      <label for="email">Correo electrónico</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <label for="contrasena">Contraseña</label>
      <input id="contrasena" name="contrasena" type="password" autocomplete="new-password" required minlength="8">
      <label for="confirmacion">Confirmar contraseña</label>
      <input id="confirmacion" name="confirmacion" type="password" autocomplete="new-password" required>
      <button type="submit">Crear cuenta</button>
      <button type="reset">Limpiar</button>
    </form>
    <div id="mensajes" aria-live="polite"></div>
  </main>
</body>
</html>
