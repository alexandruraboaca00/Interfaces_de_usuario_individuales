<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galería de productos</title>
  <link rel="stylesheet" href="estilo/comun.css">
  <script src="script/ejercicio4.js" defer></script>
</head>
<body>
  <main>
    <h1>Productos tecnológicos</h1>
    <label for="busqueda">Buscar por título</label>
    <input id="busqueda" type="search" placeholder="Escribe el nombre de un producto">
    <div class="galeria">
      <article class="producto">
        <img src="imagenes/galeria-tecnologia.png" alt="Ordenador portátil" style="object-position: left top;">
        <h2>Portátil</h2><p>650 €</p><p>Ordenador para estudiar y programar.</p>
      </article>
      <article class="producto">
        <img src="imagenes/galeria-tecnologia.png" alt="Teclado mecánico" style="object-position: 20% center;">
        <h2>Teclado</h2><p>45 €</p><p>Teclado mecánico para escribir cómodamente.</p>
      </article>
      <article class="producto">
        <img src="imagenes/galeria-tecnologia.png" alt="Visor de realidad virtual" style="object-position: right bottom;">
        <h2>Visor de realidad virtual</h2><p>300 €</p><p>Visor para juegos y experiencias virtuales.</p>
      </article>
    </div>
  </main>
</body>
</html>
