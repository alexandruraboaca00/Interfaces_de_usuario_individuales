<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contador de caracteres</title>
  <link rel="stylesheet" href="estilo/comun.css">
  <script src="script/ejercicio2.js" defer></script>
</head>
<body>
  <main>
    <h1>Contador de caracteres</h1>
    <label for="texto">Escribe un texto (máximo 280 caracteres)</label>
    <textarea id="texto" maxlength="280" aria-describedby="contador"></textarea>
    <p id="contador" aria-live="polite">Quedan 280 caracteres.</p>
  </main>
</body>
</html>
