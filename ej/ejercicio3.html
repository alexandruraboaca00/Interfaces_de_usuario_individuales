<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeria tecnologica</title>
  <link rel="stylesheet" href="estilo/estilos.css">
</head>
<body class="pagina-galeria">
  <main>
    <header class="titulo-seccion">
      <p class="etiqueta">Explorar la tecnologia</p>
      <h1>El laboratorio digital</h1>
    </header>

    <section class="galeria" aria-label="Galeria de tecnologia">
      <figure class="galeria__elemento galeria__elemento--ancho">
        <img class="recorte-1" src="imagenes/galeria-tecnologia.png" alt="Ordenador portatil mostrando un editor de codigo">
        <figcaption>Desarrollo de software</figcaption>
      </figure>
      <figure class="galeria__elemento">
        <img class="recorte-2" src="imagenes/galeria-tecnologia.png" alt="Teclado mecanico sobre una mesa de trabajo">
        <figcaption>Herramientas precisas</figcaption>
      </figure>
      <figure class="galeria__elemento galeria__elemento--alto">
        <img class="recorte-3" src="imagenes/galeria-tecnologia.png" alt="Microprocesador instalado en una placa electronica">
        <figcaption>El corazon del hardware</figcaption>
      </figure>
      <figure class="galeria__elemento">
        <img class="recorte-4" src="imagenes/galeria-tecnologia.png" alt="Brazo robotico en un laboratorio moderno">
        <figcaption>Robotica aplicada</figcaption>
      </figure>
      <figure class="galeria__elemento">
        <img class="recorte-5" src="imagenes/galeria-tecnologia.png" alt="Servidores conectados en un centro de datos">
        <figcaption>Infraestructura conectada</figcaption>
      </figure>
      <figure class="galeria__elemento galeria__elemento--ancho">
        <img class="recorte-6" src="imagenes/galeria-tecnologia.png" alt="Visor de realidad virtual sobre una mesa">
        <figcaption>Nuevas realidades</figcaption>
      </figure>
    </section>
  </main>
</body>
</html>
